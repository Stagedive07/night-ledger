name: Decode native audio assets

on:
  push:
    paths:
      - 'audio-build/native/READY.txt'

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct native M4A audio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/audio
          base64 -d audio-build/native/card-flip-single-up.b64 > assets/audio/card-flip-single-up.m4a
          base64 -d audio-build/native/card-flip-single-down.b64 > assets/audio/card-flip-single-down.m4a
          base64 -d audio-build/native/card-flip-10-stack.b64 > assets/audio/card-flip-10-stack.m4a
          base64 -d audio-build/native/full-pack-opening.b64 > assets/audio/full-pack-opening.m4a
          base64 -d audio-build/native/coin.b64 > assets/audio/coin.m4a
          cat audio-build/native/music/part-*.b64 | base64 -d > assets/audio/lr-a-min.m4a
          ls -lh assets/audio/*.m4a
      - name: Commit decoded audio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/audio/*.m4a
          if git diff --cached --quiet; then
            echo 'No audio changes to commit.'
            exit 0
          fi
          git commit -m 'Build native mobile audio assets'
          git push
