name: Build mobile SFX

on:
  push:
    paths:
      - 'audio-build/mobile-sfx-ready.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exact OGGs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lr-sfx assets/audio
          python3 - <<'PY'
          from pathlib import Path
          import base64

          root = Path('audio-build')
          out = Path('/tmp/lr-sfx')

          def decode_parts(dest, parts):
              data = bytearray()
              for rel in parts:
                  text = (root / rel).read_text().strip()
                  data.extend(base64.b64decode(''.join(text.split()), validate=False))
              (out / dest).write_bytes(data)
              print(dest, len(data))

          decode_parts('up.ogg', ['up.b64'])
          decode_parts('down.ogg', ['down.b64'])
          decode_parts('stack.ogg', ['exact-stack-0.b64','exact-stack-12.b64','exact-stack-34.b64'])
          decode_parts('pack.ogg', ['exact-pack-01.b64','exact-pack-23.b64'])
          decode_parts('coin.ogg', ['exact-coin.b64'])
          PY
      - name: Convert to mobile AAC/M4A
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -y -hide_banner -loglevel error -i /tmp/lr-sfx/up.ogg -c:a aac -b:a 128k assets/audio/card-flip-single-up.m4a
          ffmpeg -y -hide_banner -loglevel error -i /tmp/lr-sfx/down.ogg -c:a aac -b:a 128k assets/audio/card-flip-single-down.m4a
          ffmpeg -y -hide_banner -loglevel error -i /tmp/lr-sfx/stack.ogg -c:a aac -b:a 128k assets/audio/card-flip-10-stack.m4a
          ffmpeg -y -hide_banner -loglevel error -i /tmp/lr-sfx/pack.ogg -c:a aac -b:a 128k assets/audio/full-pack-opening.m4a
          ffmpeg -y -hide_banner -loglevel error -i /tmp/lr-sfx/coin.ogg -c:a aac -b:a 128k assets/audio/coin.m4a
          ls -lh assets/audio/*.m4a
      - name: Commit native SFX
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/audio/*.m4a
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build mobile-native SFX assets'
          git push
