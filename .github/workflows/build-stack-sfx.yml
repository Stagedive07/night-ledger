name: Build stack and menu SFX
on:
  push:
    paths:
      - 'audio-build/stack-ready.txt'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exact OGG files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          def decode(parts, out):
              s=''.join(Path(p).read_text() for p in parts)
              s=''.join(s.split()).rstrip('=')
              s += '=' * (-len(s) % 4)
              data=base64.b64decode(s, validate=False)
              Path(out).write_bytes(data)
              print(out, len(data), 'bytes')

          decode(
              ['audio-build/lr316-stack-0a.b64','audio-build/lr316-stack-0b.b64','audio-build/lr316-stack-1.b64','audio-build/lr316-stack-2.b64','audio-build/lr316-stack-3.b64','audio-build/lr316-stack-4.b64','audio-build/lr316-stack-5.b64'],
              'assets/audio/card-flip-10-stack.ogg'
          )
          decode(
              ['audio-build/lr316-menu-0a.b64','audio-build/lr316-menu-0b.b64','audio-build/lr316-menu-1.b64'],
              'assets/audio/menu-click.ogg'
          )
          PY
      - name: Commit exact OGG files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/audio/card-flip-10-stack.ogg assets/audio/menu-click.ogg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update stack reveal and menu click SFX'
          git pull --rebase origin main
          git push
