<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="brand" data-nav="battle" aria-label="Battle screen">
        <span class="brand-mark">NL</span>
        <span class="brand-copy"><b>NIGHT LEDGER</b><small>PROTOTYPE I</small></span>
      </button>
      <div class="resources" aria-label="Resources">
        <button class="resource-chip" data-tip="Gold levels cards"><span>G</span><b id="gold-count">0</b></button>
        <button class="resource-chip" data-tip="Intel upgrades the Hideout"><span>I</span><b id="intel-count">0</b></button>
        <button class="resource-chip" data-tip="Whispers buy Deck Booster Packs"><span>W</span><b id="whisper-count">0</b></button>
      </div>
    </header>

    <main id="screen" class="screen"><div class="empty-state"><b>INITIALIZING NIGHT LEDGER…</b><p>If this message remains visible, the file viewer is blocking game scripts. Open the hosted PWA in a browser.</p></div></main>

      <button data-nav="settings" class="nav-btn"><span>⚙</span><small>MORE</small></button>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script>

  const CARD_LEVEL_CAP = 100;

  const firstNames = ['Mira','Venn','Sable','Tarin','Nox','Ilya','Rook','Kest','Vale','Corin','Mara','Joss','Vera','Kade','Tessa','Bran','Nira','Oren','Lysa','Dain','Riven','Sera','Cairn','Voss','Eris'];
  const lastNames = ['Voss','Hale','Crow','Morn','Kerr','Vale','Ash','Rook','Sorn','Vane','Dusk','Mire','Flint','Kross','Wren','Thorn','Grey','Locke','Marl','Drake','Vex','Sable','Kell','Rane','Noir'];
  const epithetA = ['Crooked','Quiet','Pale','Red','Black','Last','Broken','Hollow','Velvet','Iron','Ashen','Cinder','Blind','Cold','Grim','Silver','Ragged','Scarlet','Silent','Wicked','Old','Thin','Shrouded','Burned','Hidden'];
  const epithetB = ['Knife','Crow','Widow','Fox','Hound','Adder','Saint','Bell','Jackal','Raven','Viper','Moth','Spider','Wolf','Candle','Needle','Hook','Rat','Mask','Harrow','Bishop','Warden','Butcher','Scribe','Prince'];

  const fieldAbilities = [
    'Contract Killer','Opening Strike','Finisher','Double Strike','Momentum','Patient Killer','Eviscerate','Execute','Shortcut','Sabotage','Inside Man','Contract Insight'
  ];
  const syndicateAbilities = ['Architect','Broker','Appraiser','Salvager','Bookkeeper','Informant','Safehouse'];
  const simpleCutthroatAbilities = ['Contract Killer','Opening Strike','Finisher','Double Strike','Momentum','Patient Killer','Eviscerate','Execute'];

  function titleCaseName(tier, i) {
    if (tier === 1) {
      const streetNames = ['Ratknife','Mira Voss','The Candleman','Alley Surgeon','Crooked Tom','Rooftop Runner','Needle Kate','Black Jack','Tin-Ear Venn','Old Crow','Dock Rat','Sootface','Little Rook','Knuckle Joss','Broken Vale','Mara Flint','Latch','Grey Hook','Nox Hale','Ash Runner','Sable Kerr','Vera Locke','Tarin Wren','Kade Morn','The Bellboy'];
      return streetNames[i];
    }
    if (tier === 2 && i === 22) return 'Tarin Quill';
    if (tier <= 4) return `${firstNames[(i + tier * 3) % firstNames.length]} ${lastNames[(i * 7 + tier * 5) % lastNames.length]}`;
    if (tier <= 7) return `The ${epithetA[(i * 3 + tier) % epithetA.length]} ${epithetB[(i * 5 + tier) % epithetB.length]}`;
    if (tier === 8) return `${epithetA[(i + 7) % epithetA.length]} ${['Regent','Duchess','Confessor','Chancellor','Heir','Prelate','Marshal','Consort','Herald','Steward','Oracle','Magistrate','Emissary','Viscount','Keeper','Usurper','Seneschal','Prince','Baron','Adjudicator','Envoy','Viceroy','Curator','Executioner','Minister'][i]}`;
    if (tier === 9) return `${['Last','Pale','Grave','Final','Hollow','Dead','Still','White','Cold','Red','Black','Silent','Ash','Bleak','Severed','Empty','Iron','Scarred','Fallen','Buried','Lost','Drowned','Shorn','Withered','Blind'][i]} ${['Witness','Knife','Widow','Saint','King','Crow','Bell','Warden','Viper','Scribe','Hound','Judge','Raven','Hand','Mask','Bishop','Fox','Harrow','Butcher','Prince','Adder','Wolf','Moth','Hook','Blade'][i]}`;
    return `${['The Nameless','The Unwritten','The Unseen','The Last Knife','Mother Night','The Quiet Between','The Empty Throne','The First Poison','The Final Witness','The Black Horizon','The Unmade','The Uncounted','The Sleepless','The Crownless','The Unburied','The Red Silence','The Hollow King','The Last Shadow','The Pale Oath','The Severed Name','The Closed Eye','The Black Saint','The Unspoken','The End of Kings','The Other Hand'][i]}`;
  }

  function abilityFor(tier, index) {
    if (tier === 1) return null;
    if (tier === 2) return makeAbility(simpleCutthroatAbilities[index % simpleCutthroatAbilities.length], tier, index);
    const useSyndicate = index % 5 === 4 || index % 7 === 5;
    const pool = useSyndicate ? syndicateAbilities : fieldAbilities;
    return makeAbility(pool[(index * 3 + tier) % pool.length], tier, index);
  }

  function makeAbility(name, tier, index) {
    const q = tier - 1;
    let value = 0;
    let zone = 'operation';
    let text = '';
    switch (name) {
      case 'Contract Killer': value = 0.035 + q * 0.008; text = `+${pct(value)} damage to Operation targets.`; break;
      case 'Opening Strike': value = 0.04 + q * 0.008; text = `+${pct(value)} damage while the enemy is above 80% HP.`; break;
      case 'Finisher': value = 0.04 + q * 0.008; text = `+${pct(value)} damage while the enemy is below 30% HP.`; break;
      case 'Double Strike': value = 0.015 + q * 0.004; text = `${pct(value)} chance for this operative to strike twice.`; break;
      case 'Momentum': value = 0.004 + q * 0.001; text = `Each kill adds ${pct(value)} global damage, up to 10 stacks.`; break;
      case 'Patient Killer': value = 0.003 + q * 0.0008; text = `Damage rises ${pct(value)} per second against the same target.`; break;
      case 'Eviscerate': value = 0.004 + q * 0.001; text = `${pct(value)} chance each second to deal a brutal 5x strike.`; break;
      case 'Execute': value = 0.006 + q * 0.0012; text = `${pct(value)} chance each second to execute weakened enemies.`; break;
      case 'Shortcut': value = 0.01 + q * 0.002; text = `${pct(value)} chance after a kill to skip the next normal encounter.`; break;
      case 'Sabotage': value = 0.015 + q * 0.004; text = `Operation targets begin with ${pct(value)} less HP.`; break;
      case 'Inside Man': value = 1; text = `Begin a new Operation 1 encounter deeper. Stacks to 3.`; break;
      case 'Contract Insight': value = 0.03 + q * 0.008; text = `+${pct(value)} Intel from defeated Operation targets.`; break;
      case 'Architect': zone = 'syndicate'; value = 0.035 + q * 0.008; text = `Hideout construction is ${pct(value)} faster.`; break;
      case 'Broker': zone = 'syndicate'; value = 0.025 + q * 0.005; text = `Deck Booster Packs cost ${pct(value)} fewer Whispers.`; break;
      case 'Appraiser': zone = 'syndicate'; value = 0.025 + q * 0.005; text = `Improves higher-rarity pull weights by ${pct(value)} relative.`; break;
      case 'Salvager': zone = 'syndicate'; value = 0.08 + q * 0.015; text = `Selling cards refunds ${pct(value)} more Whispers.`; break;
      case 'Bookkeeper': zone = 'syndicate'; value = 0.04 + q * 0.008; text = `+${pct(value)} Gold from Operations and offline farming.`; break;
      case 'Informant': zone = 'syndicate'; value = 0.03 + q * 0.006; text = `+${pct(value)} Intel from Operations and offline farming.`; break;
      case 'Safehouse': zone = 'syndicate'; value = Math.min(1 + Math.floor(q / 2), 5); text = `Adds ${value}h to the offline reward cap.`; break;
    }
    return { name, value, zone, text };
  }

  function pct(x) { return `${(x * 100).toFixed(x < 0.01 ? 1 : 0)}%`; }

  const CARDS = [];
  for (let tier = 1; tier <= 10; tier++) {
    for (let i = 0; i < 25; i++) {
      CARDS.push({
        id: `t${tier}-c${String(i + 1).padStart(2, '0')}`,
        tier,
        index: i,
        name: titleCaseName(tier, i),
        ability: abilityFor(tier, i),
      });
    }
  }
  const CARD_MAP = Object.fromEntries(CARDS.map(c => [c.id, c]));

  function tierData(tier) { return TIERS[tier - 1]; }
  function tierForHideout(h) {
    let result = 1;
    TIERS.forEach(t => { if (h >= t.unlock) result = t.id; });
    return result;
  }
  function whisperRatePerHour(hideoutLevel) { return 100 * Math.pow(1.32, hideoutLevel - 1); }
  function normalEnemyHp(operation) { return 500 * Math.pow(1.18, operation - 1) * Math.pow(1.001, ((operation - 1) * (operation - 2)) / 2); }
  function targetHp(operation) { return normalEnemyHp(operation) * 6; }
  function normalGold(operation) { return 10 * Math.pow(1.15, operation - 1); }
  function normalIntel(operation) { return 2 * Math.pow(1.09, operation - 1); }
  function targetRewardMultiplier() { return 20; }
  function baseDpsMid(tier) { return 10 * Math.pow(4.2, tier - 1); }
  function rollBaseDps(tier) { return baseDpsMid(tier) * (0.9 + Math.random() * 0.2); }
  function cardDps(instance) { return instance.baseDps * Math.pow(1.10, instance.level - 1); }
  function cardLevelCost(tier, level) { return 25 * Math.pow(4.2, tier - 1) * Math.pow(1.18, level - 1); }
  function hideoutOperationReq(level) { if (level <= 1) return 0; return Math.round(2 * (level - 1) + 0.13 * Math.pow(level - 1, 2)); }
  function hideoutIntelCost(level) { if (level <= 1) return 0; return 500 * Math.pow(1.9, level - 2); }
  function hideoutBuildMinutes(level) {
    if (level <= 1) return 0;
    return 5 * Math.pow(576, (level - 2) / 18);
  }
  function packBaseCost(tier) {
    const unlock = tierData(tier).unlock;
    const rate = whisperRatePerHour(unlock);
    return Math.round(rate * PACK_HOURS_AT_UNLOCK[tier - 1]);
  }
  function syndicateSlots(hideoutLevel) {
    if (hideoutLevel < 3) return 0;
    if (hideoutLevel < 6) return 2;
    if (hideoutLevel < 10) return 3;
    if (hideoutLevel < 15) return 4;
    if (hideoutLevel < 20) return 5;
    return 6;
  }

  function packOdds(packTier, hideoutLevel, appraiserRelative = 0) {
    if (packTier <= 1) return [{ tier: 1, p: 1 }];
    const topUnlock = tierData(packTier).unlock;
    const levelsSinceUnlock = Math.max(0, hideoutLevel - topUnlock);
    const topP = Math.min(0.80, TOP_CHANCE_BASE[packTier - 1] * Math.pow(1.18, levelsSinceUnlock));
    const probs = new Map([[packTier, topP]]);
    const lowerTiers = [];
    for (let d = 1; d <= 5; d++) {
      const t = packTier - d;
      if (t >= 1) lowerTiers.push({ tier: t, weight: LOWER_WEIGHTS[d - 1] });
    }
    const wSum = lowerTiers.reduce((a, b) => a + b.weight, 0);
    lowerTiers.forEach(x => probs.set(x.tier, (1 - topP) * x.weight / wSum));

    // Appraiser improves higher rarities by relative weight, never percentage points.
    const capped = Math.min(0.25, Math.max(0, appraiserRelative));
    if (capped > 0) {
      const weighted = [];
      let total = 0;
      [...probs.entries()].forEach(([tier, p]) => {
        const rank = tier / packTier;
        const w = p * (1 + capped * rank);
        weighted.push([tier, w]); total += w;
      });
      return weighted.map(([tier, w]) => ({ tier, p: w / total })).sort((a,b) => a.tier - b.tier);
    }
    return [...probs.entries()].map(([tier, p]) => ({ tier, p })).sort((a,b) => a.tier - b.tier);
  }

  function randomCardDefFromTier(tier) {
    const list = CARDS.filter(c => c.tier === tier);
    return list[Math.floor(Math.random() * list.length)];
  }

  function rollTier(odds) {
    const r = Math.random();
    let c = 0;
    for (const row of odds) { c += row.p; if (r <= c) return row.tier; }
    return odds[odds.length - 1].tier;
  }

  const enemyNames = ['Gate Watch','Roof Patrol','Lantern Guard','Hall Sentry','Courier','Ward Hound','Lookout','Vault Guard','House Blade','Night Watch','Keyholder','Silent Guard'];
  const targetTitles = ['The Collector','Warden Vey','The Red Clerk','Captain Sorn','The Quiet Judge','The Glass Widow','Master Kerr','The Ash Bishop','Lord Vane','The Pale Hand'];
  function enemyName(operation, encounter, target=false) {
    if (target) return targetTitles[(operation - 1) % targetTitles.length];
    return enemyNames[(operation * 5 + encounter * 3) % enemyNames.length];
  }

  function formatNum(n) {
    if (!Number.isFinite(n)) return '∞';
    const abs = Math.abs(n);
    if (abs < 1000) return n < 100 ? n.toFixed(1).replace('.0','') : Math.floor(n).toString();
    const units = ['K','M','B','T','Qa','Qi'];
    let v = n, i = -1;
    while (Math.abs(v) >= 1000 && i < units.length - 1) { v /= 1000; i++; }
    return `${v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2)}${units[i]}`;
  }
  function formatTime(seconds) {
    seconds = Math.max(0, Math.ceil(seconds));
    const d = Math.floor(seconds / 86400); seconds %= 86400;
    const h = Math.floor(seconds / 3600); seconds %= 3600;
    const m = Math.floor(seconds / 60); const s = seconds % 60;
    if (d) return `${d}d ${h}h`;
    if (h) return `${h}h ${m}m`;
    if (m) return `${m}m ${s}s`;
    return `${s}s`;
  }

  return {
    TIERS, CARDS, CARD_MAP, CARD_LEVEL_CAP, SHINY_CHANCE, BASE_OFFLINE_HOURS, MAX_OFFLINE_HOURS,
    tierData, tierForHideout, whisperRatePerHour, normalEnemyHp, targetHp, normalGold, normalIntel,
    targetRewardMultiplier, baseDpsMid, rollBaseDps, cardDps, cardLevelCost, hideoutOperationReq,
    hideoutIntelCost, hideoutBuildMinutes, packBaseCost, syndicateSlots, packOdds,
    randomCardDefFromTier, rollTier, enemyName, formatNum, formatTime, pct
  };
})();

      resolveBonus: 0,
      gold: 0,
      intel: 0,
      whispers: 25,
      unlocks: { whispers: true, gold: false, intel: false, hideout: false, syndicate: false },
      hideoutLevel: 1,
      hideoutBuild: null,
      currentOperation: 1,
      highestCleared: 0,
      opEntryFlags: {},
      battle: {
        mode: 'push',
        encounter: 1,
        enemy: null,
        targetFailed: false,
        momentumStacks: 0,
        lastKillAt: 0,
        paused: false,
      },
      inventory: [],
      deck: [],
      syndicate: [],
      discovered: [],
      holoSeen: [],
      storySeen: [],
      freeStreetPack: true,
      firstPackOpened: false,
      awaitingFinale: false,
      prestigeReady: false,
      settings: { reducedMotion: false, sound: false },
      stats: {
        totalKills: 0,
        targetsKilled: 0,
        packsOpened: 0,
        cardsSeen: 0,
        holosSeen: 0,
        goldEarned: 0,
        intelEarned: 0,
        whispersEarned: 25,
      }
    };
  }

  function load() {
    const raw = storageGet(SAVE_KEY);
    if (!raw) {
      state = initialState();
      currentScreen = 'packs';
      setTimeout(() => {
        enqueueStory(SD.opening);
        enqueueStory(SD.system.whispers);
        enqueueStory(SD.firstPack);
      }, 200);
      return;
    }
    try {
      state = JSON.parse(raw);
      migrateState();
      applyOfflineProgress();
      currentScreen = state.firstPackOpened ? 'battle' : 'packs';
    } catch (e) {
      console.error(e);
      state = initialState();
      toast('Save could not be read. Started a fresh prototype save.');
    }
  }

  function migrateState() {
    const fresh = initialState();
    state = Object.assign(fresh, state || {});
    state.unlocks = Object.assign(fresh.unlocks, state.unlocks || {});
    state.battle = Object.assign(fresh.battle, state.battle || {});
    state.settings = Object.assign(fresh.settings, state.settings || {});
    state.stats = Object.assign(fresh.stats, state.stats || {});
    state.inventory ||= [];
    state.deck ||= [];
    state.syndicate ||= [];
    state.discovered ||= [];
    state.holoSeen ||= [];
    state.storySeen ||= [];
    state.opEntryFlags ||= {};
  }

  function save() {
    state.lastSavedAt = now();
    storageSet(SAVE_KEY, JSON.stringify(state));
  }

  function getDef(inst) { return GD.CARD_MAP[inst.defId]; }
  function getInstance(id) { return state.inventory.find(c => c.uid === id); }
  function deckInstances() { return state.deck.map(getInstance).filter(Boolean); }
  function syndicateInstances() { return state.syndicate.map(getInstance).filter(Boolean); }

  function isSyndicateDef(def) { return def?.ability?.zone === 'syndicate'; }
  function isOperationDef(def) { return !def?.ability || def.ability.zone === 'operation'; }

  function effectTotals() {
    const syn = syndicateInstances();
    const deck = deckInstances();
    const totals = {
      architect:0, broker:0, appraiser:0, salvager:0, bookkeeper:0, informant:0, safehouse:0,
      sabotage:0, insideMan:0, contractInsight:0, shortcut:0,
    };
    syn.forEach(inst => {
      const a = getDef(inst)?.ability; if (!a) return;
      switch(a.name){
        case 'Architect': totals.architect += a.value; break;
        case 'Broker': totals.broker += a.value; break;
        case 'Appraiser': totals.appraiser += a.value; break;
        case 'Salvager': totals.salvager += a.value; break;
        case 'Bookkeeper': totals.bookkeeper += a.value; break;
        case 'Informant': totals.informant += a.value; break;
        case 'Safehouse': totals.safehouse += a.value; break;
      }
    });
    deck.forEach(inst => {
      const a = getDef(inst)?.ability; if (!a) return;
      switch(a.name){
        case 'Sabotage': totals.sabotage += a.value; break;
        case 'Inside Man': totals.insideMan += a.value; break;
        case 'Contract Insight': totals.contractInsight += a.value; break;
        case 'Shortcut': totals.shortcut += a.value; break;
      }
    });
    totals.architect = Math.min(.40, totals.architect);
    totals.broker = Math.min(.25, totals.broker);
    totals.appraiser = Math.min(.25, totals.appraiser);
    totals.bookkeeper = Math.min(.75, totals.bookkeeper);
    totals.informant = Math.min(.50, totals.informant);
    totals.salvager = Math.min(1.00, totals.salvager);
    totals.safehouse = Math.min(GD.MAX_OFFLINE_HOURS - GD.BASE_OFFLINE_HOURS, totals.safehouse);
    totals.sabotage = Math.min(.25, totals.sabotage);
    totals.insideMan = Math.min(3, Math.floor(totals.insideMan));
    totals.contractInsight = Math.min(.50, totals.contractInsight);
    totals.shortcut = Math.min(.20, totals.shortcut);
    return totals;
  }

  function offlineCapHours() { return GD.BASE_OFFLINE_HOURS + effectTotals().safehouse; }
  function whisperRate() { return GD.whisperRatePerHour(state.hideoutLevel); }
  function packCost(tier) { return Math.max(1, Math.round(GD.packBaseCost(tier) * (1 - effectTotals().broker))); }

  function addGold(v) { if (v<=0) return; state.gold += v; state.stats.goldEarned += v; }
  function addIntel(v) { if (v<=0) return; state.intel += v; state.stats.intelEarned += v; }
  function addWhispers(v) { if (v<=0) return; state.whispers += v; state.stats.whispersEarned += v; }

  function applyOfflineProgress() {
    const last = Number(state.lastSavedAt || now());
    const elapsed = Math.max(0, (now() - last) / 1000);
    if (elapsed < 30) return;
    const cap = offlineCapHours() * 3600;
    const seconds = Math.min(elapsed, cap);
    const w = whisperRate() * seconds / 3600;
    addWhispers(w);

    let kills = 0, g = 0, i = 0;
    if (state.firstPackOpened && deckInstances().length) {
      const farmOp = Math.max(1, state.highestCleared || state.currentOperation);
      const hp = GD.normalEnemyHp(farmOp);
      const dps = Math.max(1, estimateDeckDps(false, 0.5));
      const ttk = Math.max(.5, hp / dps);
      kills = Math.floor(seconds / ttk);
      kills = Math.min(kills, 250000);
      const e = effectTotals();
      g = kills * GD.normalGold(farmOp) * (1 + e.bookkeeper);
      i = kills * GD.normalIntel(farmOp) * (1 + e.informant);
      addGold(g); addIntel(i);
      state.stats.totalKills += kills;
    }
    setTimeout(() => showOfflineSummary(seconds, w, kills, g, i), 350);
  }

  function showOfflineSummary(seconds, whispers, kills, gold, intel) {
    if (seconds < 60) return;
    const html = `<div class="modal-backdrop"><div class="modal">
      <div class="kicker">OFFLINE REPORT</div><h2>${GD.formatTime(seconds)} AWAY</h2>
      <div class="stats-grid">
        <div class="stat"><small>Whispers</small><b>+${GD.formatNum(whispers)}</b></div>
        <div class="stat"><small>Kills</small><b>${GD.formatNum(kills)}</b></div>
        <div class="stat"><small>Gold</small><b>+${GD.formatNum(gold)}</b></div>
        <div class="stat"><small>Intel</small><b>+${GD.formatNum(intel)}</b></div>
      </div><div class="btn-row" style="margin-top:12px"><button class="btn primary" id="offline-close">COLLECT</button></div>
    </div></div>`;
    modalRoot.innerHTML = html; modalOpen = true;
    document.getElementById('offline-close').onclick = () => { modalRoot.innerHTML=''; modalOpen=false; render(); maybeShowNextStory(); };
  }

  function enqueueStory(entry, replay=false) {
    if (!entry) return;
    if (!replay && state.storySeen.includes(entry.id)) return;
    storyQueue.push({ entry, replay });
    maybeShowNextStory();
  }

  function maybeShowNextStory() {
    if (modalOpen || activeStory || !storyQueue.length) return;
    const next = storyQueue.shift();
    showStory(next.entry, next.replay);
  }

  function showStory(entry, replay=false) {
    activeStory = { entry, replay };
    activeStoryPage = 0;
    modalOpen = true;
    drawStoryPage();
  }

  function drawStoryPage() {
    const {entry} = activeStory;
    const last = activeStoryPage === entry.pages.length - 1;
    const dots = entry.pages.map((_,i)=>`<i class="${i<=activeStoryPage?'on':''}"></i>`).join('');
    let label = last ? 'CLOSE' : 'CONTINUE';
    if (entry.id === 'prestige1' && last) label = 'BEGIN PRESTIGE I';
    modalRoot.innerHTML = `<div class="modal-backdrop"><div class="modal story-modal">
      <div class="story-kicker">STORY // ${String(activeStoryPage+1).padStart(2,'0')}</div>
      <h2>${entry.title}</h2>
      <div class="story-copy">${escapeHtml(entry.pages[activeStoryPage])}</div>
      <div class="story-progress">${dots}</div>
      <button class="btn primary" id="story-next" style="width:100%">${label}</button>
    </div></div>`;
    document.getElementById('story-next').onclick = () => {
      if (!last) { activeStoryPage++; drawStoryPage(); return; }
      if (!activeStory.replay && !state.storySeen.includes(entry.id)) state.storySeen.push(entry.id);
      const id = entry.id;
      activeStory = null; modalRoot.innerHTML=''; modalOpen=false;
      if (id === 'finale') { enqueueStory(SD.prestige); }
      else if (id === 'prestige1') { performPrestige(); return; }
      save(); render(); maybeShowNextStory();
    };
  }

  function toast(msg) {
    const el = document.createElement('div'); el.className='toast'; el.textContent=msg;
    toastRoot.appendChild(el); setTimeout(()=>el.remove(), 2500);
  }

  function unlockGold() {
    if (state.unlocks.gold) return;
    state.unlocks.gold = true; enqueueStory(SD.system.gold); save();
  }
  function unlockIntelAndHideout() {
    if (!state.unlocks.intel) { state.unlocks.intel = true; enqueueStory(SD.system.intel); }
    if (!state.unlocks.hideout) { state.unlocks.hideout = true; enqueueStory(SD.system.hideout); }
    save();
  }

  function createCardInstance(def, packTier, packPrice) {
    return {
      uid: uid(), defId: def.id, tier: def.tier, baseDps: GD.rollBaseDps(def.tier), level: 1,
      holo: Math.random() < GD.SHINY_CHANCE,
      sourcePackTier: packTier, sourcePackCost: packPrice,
      acquiredAt: now(),
    };
  }

  function generatePack(packTier, paidPrice) {
    const e = effectTotals();
    const odds = GD.packOdds(packTier, state.hideoutLevel, e.appraiser);
    const cards = [];
    const guaranteed = createCardInstance(GD.randomCardDefFromTier(packTier), packTier, paidPrice);
    guaranteed.guaranteed = true;
    cards.push(guaranteed);
    for (let i=0;i<9;i++) {
      const t = GD.rollTier(odds);
      cards.push(createCardInstance(GD.randomCardDefFromTier(t), packTier, paidPrice));
    }
    // Fisher-Yates: guaranteed/top card can appear anywhere.
    for (let i=cards.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [cards[i],cards[j]]=[cards[j],cards[i]]; }
    return cards;
  }

  function openPack(packTier, free=false) {
    const tier = GD.tierData(packTier);
    if (state.hideoutLevel < tier.unlock) return toast(`Hideout ${tier.unlock} required.`);
    let price = free ? 0 : packCost(packTier);
    if (!free && state.whispers < price) return toast('Not enough Whispers.');
    if (!free) state.whispers -= price;
    if (free) state.freeStreetPack = false;

    const before = new Set(state.discovered);
    const pack = generatePack(packTier, free ? GD.packBaseCost(packTier) : price);
    let hadDuplicate = false, hadHolo = false;
    pack.forEach(c => {
      c.isNew = !before.has(c.defId) && !state.discovered.includes(c.defId);
      if (!c.isNew) hadDuplicate = true;
      if (!state.discovered.includes(c.defId)) { state.discovered.push(c.defId); state.stats.cardsSeen++; }
      if (c.holo && !state.holoSeen.includes(c.defId)) { state.holoSeen.push(c.defId); state.stats.holosSeen++; hadHolo=true; }
      state.inventory.push(c);
    });
    state.stats.packsOpened++;
    if (!state.firstPackOpened) {
      state.firstPackOpened = true;
      autoFillDeck();
      currentScreen = 'battle';
    }
    save();
    showPackOpening(packTier, pack, price, () => {
      if (hadDuplicate) enqueueStory(SD.system.firstDuplicate);
      if (hadHolo) enqueueStory(SD.system.shiny);
      render(); maybeShowNextStory();
    });
  }

  function showPackOpening(packTier, pack, price, done) {
    modalOpen = true;
    const t = GD.tierData(packTier);
    modalRoot.innerHTML = `<div class="modal-backdrop"><div class="modal pack-modal">
      <div class="pack-stage" id="pack-stage" style="color:${t.accent}">
        <div class="pack-rip" id="pack-rip"></div>
        <div class="pack-cover" id="pack-cover">
          <div class="pack-title">${t.name.toUpperCase()}<br>DECK</div>
          <div class="pack-sub">BOOSTER PACK</div>
          <div class="pack-count">10 CARDS // TAP TO OPEN</div>
        </div>
        <div class="reveal-stack" id="reveal-stack"></div>
      </div>
    </div></div>`;
    const cover = document.getElementById('pack-cover');
    cover.onclick = () => {
      if (cover.dataset.opening) return;
      cover.dataset.opening='1'; cover.classList.add('shake');
      setTimeout(()=>{
        cover.classList.remove('shake'); cover.classList.add('opening');
        document.getElementById('pack-rip').classList.add('fly');
        setTimeout(()=> startReveal(packTier, pack, price, done), 560);
      }, state.settings.reducedMotion ? 10 : 650);
    };
  }

  function startReveal(packTier, pack, price, done) {
    const cover=document.getElementById('pack-cover'); if(cover) cover.style.display='none';
    const stack=document.getElementById('reveal-stack'); stack.classList.add('active');
    let index=0, faceUp=false;

    function cardFace(inst, idx, front) {
      const def=getDef(inst), td=GD.tierData(inst.tier);
      const newTag=inst.isNew?'<span class="new-tag">NEW</span>':'';
      const holo=inst.holo?'<span class="holo-tag">HOLO</span>':'';
      const ability=def.ability ? `<div class="ability"><b>${escapeHtml(def.ability.name)}</b><br>${escapeHtml(def.ability.text)}</div>` : '<div class="ability">No special ability.</div>';
      return `<div class="reveal-face reveal-back"><div class="back-mark">NL</div><small>SEALED OPERATIVE RECORD</small></div>
      <div class="reveal-face reveal-front" style="border-color:${td.accent}">${newTag}${holo}<div>
        <div class="tier-line" style="color:${td.accent}">${td.name.toUpperCase()} // ${inst.holo?'HOLOGRAPHIC':'STANDARD'}</div>
        <h3>${escapeHtml(def.name)}</h3></div>
        <div class="blank-art">[ CARD ART TBD ]</div>
        <div><div class="reveal-dps">BASE DPS ${GD.formatNum(inst.baseDps)}</div>${ability}</div>
      </div>`;
    }

    function draw() {
      if (index >= pack.length) return showSummary();
      stack.innerHTML='';
      const maxVisible=Math.min(4, pack.length-index);
      for(let j=maxVisible-1;j>=0;j--){
        const inst=pack[index+j]; const def=getDef(inst); const td=GD.tierData(inst.tier);
        const el=document.createElement('div'); el.className=`reveal-card ${inst.holo?'holo':''}`;
        el.style.borderColor=td.accent; el.style.zIndex=10-j;
        const poses=[
          'translate(0,0) rotate(0deg) scale(1)',
          'translate(13px,17px) rotate(2deg) scale(.96)',
          'translate(-12px,28px) rotate(-2.5deg) scale(.92)',
          'translate(18px,39px) rotate(3deg) scale(.88)'
        ];
        el.style.transform=poses[j]; el.innerHTML=`<div class="flip-inner ${j===0&&faceUp?'faceup':''}">${cardFace(inst,index+j,j===0)}</div>`;
        if(j===0){
          el.onclick=()=>{
            if(!faceUp){faceUp=true; el.querySelector('.flip-inner').classList.add('faceup'); return;}
            el.onclick=null;
            const cls=['swipe-r0','swipe-r1','swipe-r2','swipe-r3'][index%4];
            if(state.settings.reducedMotion){ index++; faceUp=false; draw(); }
            else { el.classList.add(cls); setTimeout(()=>{index++;faceUp=false;draw();},410); }
          };
        }
        stack.appendChild(el);
      }
      const hint=document.createElement('div'); hint.className='reveal-hint'; hint.textContent=faceUp?'TAP AGAIN FOR NEXT CARD':'TAP TO FLIP'; stack.appendChild(hint);
    }

    function showSummary(){
      const rows=pack.map(c=>{const d=getDef(c),t=GD.tierData(c.tier);return `<div class="summary-tile" style="border-color:${t.accent}">${c.holo?'HOLO ':''}${c.isNew?'NEW ':''}<b>${escapeHtml(d.name)}</b><span>${t.name}</span></div>`}).join('');
      stack.innerHTML=`<div class="pack-summary"><div class="kicker">PACK COMPLETE</div><h2>${GD.tierData(packTier).name.toUpperCase()} DECK BOOSTER PACK</h2><div class="summary-grid">${rows}</div><button class="btn primary" id="pack-done" style="width:100%;margin-top:14px">ADD TO LIBRARY</button></div>`;
      document.getElementById('pack-done').onclick=()=>{modalRoot.innerHTML='';modalOpen=false;done();};
    }
    draw();
  }

  function autoFillDeck() {
    const candidates = state.inventory.filter(c=>isOperationDef(getDef(c))).sort((a,b)=>GD.cardDps(b)-GD.cardDps(a));
    state.deck = candidates.slice(0,10).map(c=>c.uid);
  }

  function autoFillSyndicate() {
    const slots=GD.syndicateSlots(state.hideoutLevel);
    const candidates=state.inventory.filter(c=>isSyndicateDef(getDef(c)));
    const seen=new Set(), chosen=[];
    // prefer diverse effects before duplicates
    candidates.sort((a,b)=>b.tier-a.tier).forEach(c=>{
      const n=getDef(c).ability.name;
      if(chosen.length<slots && !seen.has(n)){chosen.push(c.uid);seen.add(n);}
    });
    candidates.forEach(c=>{if(chosen.length<slots&&!chosen.includes(c.uid))chosen.push(c.uid);});
    state.syndicate=chosen.slice(0,slots); save(); render();
  }

  function enterCurrentOperation() {
    const op=state.currentOperation;
    if (state.opEntryFlags[op]) return;
    state.opEntryFlags[op]=true;
    const skip=effectTotals().insideMan;
    state.battle.encounter=Math.min(24,1+skip);
  }

  function spawnEnemy() {
    enterCurrentOperation();
    const op=state.currentOperation;
    const encounter=state.battle.encounter;
    const target=encounter>=25;
    let maxHp=target?GD.targetHp(op):GD.normalEnemyHp(op);
    if(target) maxHp *= (1-effectTotals().sabotage);
    state.battle.enemy={
      id:uid('e'), name:GD.enemyName(op,encounter,target), target,
      hp:maxHp,maxHp, spawnedAt:now(), deadline:target?now()+30000:null,
    };
  }

  function estimateDeckDps(target=false, hpRatio=1) {
    let total=0;
    const elapsed=state.battle.enemy ? (now()-state.battle.enemy.spawnedAt)/1000 : 0;
    deckInstances().forEach(inst=>{
      const def=getDef(inst); let d=GD.cardDps(inst); const a=def.ability;
      if(a){
        if(a.name==='Contract Killer'&&target)d*=1+a.value;
        if(a.name==='Opening Strike'&&hpRatio>.8)d*=1+a.value;
        if(a.name==='Finisher'&&hpRatio<.3)d*=1+a.value;
        if(a.name==='Patient Killer')d*=1+Math.min(.50,a.value*elapsed);
      }
      total+=d;
    });
    const momentumEffects=deckInstances().map(c=>getDef(c)?.ability).filter(a=>a?.name==='Momentum');
    const momentumPerStack=Math.min(.05,sum(momentumEffects.map(a=>a.value)));
    const momentumBonus=Math.min(.50,momentumPerStack*state.battle.momentumStacks);
    return total*(1+momentumBonus)*(1+(state.resolveBonus||0));
  }

  function procCombatSecond() {
    const enemy=state.battle.enemy; if(!enemy) return;
    const target=enemy.target;
    const hpRatio=enemy.hp/enemy.maxHp;
    let bonusDamage=0;
    let executeChance=0;
    deckInstances().forEach(inst=>{
      const def=getDef(inst), a=def.ability; if(!a)return;
      const cdps=GD.cardDps(inst);
      if(a.name==='Double Strike' && Math.random()<a.value) bonusDamage+=cdps;
      if(a.name==='Eviscerate' && Math.random()<a.value) { bonusDamage+=cdps*5; floatingHit('EVISCERATE'); }
      if(a.name==='Execute') executeChance+=a.value;
    });
    executeChance=Math.min(.10,executeChance);
    const threshold=target?.05:.15;
    if(hpRatio<=threshold && Math.random()<executeChance){enemy.hp=0;floatingHit('EXECUTE');return;}
    enemy.hp-=bonusDamage;
  }

  function floatingHit(text) {
    const ec=document.querySelector('.enemy-card'); if(!ec)return;
    const el=document.createElement('div');el.className='float-hit';el.textContent=text;ec.appendChild(el);setTimeout(()=>el.remove(),700);
  }

  function handleEnemyKilled() {
    const enemy=state.battle.enemy; if(!enemy)return;
    const op=state.currentOperation; const e=effectTotals();
    const mult=enemy.target?GD.targetRewardMultiplier():1;
    let gold=GD.normalGold(op)*mult*(1+e.bookkeeper);
    let intel=GD.normalIntel(op)*mult*(1+e.informant);
    if(enemy.target) intel*=1+e.contractInsight;
    addGold(gold); addIntel(intel);
    state.stats.totalKills++; unlockGold();
    state.battle.momentumStacks=Math.min(10,state.battle.momentumStacks+1);
    state.battle.lastKillAt=now();

    if(enemy.target){
      state.stats.targetsKilled++;
      state.highestCleared=Math.max(state.highestCleared,op);
      if(op===1) unlockIntelAndHideout();
      if(SD.operations[op]) enqueueStory(SD.operations[op]);
      // First-clear Whispers: 5% of highest available pack price.
      addWhispers(packCost(GD.tierForHideout(state.hideoutLevel))*.05);
      if(op>=100){
        state.currentOperation=100; state.battle.enemy=null; state.battle.encounter=25; state.battle.paused=true;
        if(state.hideoutLevel>=20){triggerFinale();} else {state.awaitingFinale=true;toast('Operation 100 cleared. Complete Hideout 20 to open the final door.');}
      } else {
        state.currentOperation=op+1; state.battle.encounter=1; state.battle.enemy=null; state.battle.targetFailed=false; state.battle.mode='push';
      }
    } else {
      let next=state.battle.encounter;
      if(state.battle.mode==='farm') next=24;
      else {
        next++;
        if(next<25 && Math.random()<e.shortcut){next++;toast('Shortcut: skipped an encounter.');}
        next=Math.min(25,next);
      }
      state.battle.encounter=next; state.battle.enemy=null;
    }
    save();
  }

  function failTarget() {
    const op=state.currentOperation;
    state.battle.targetFailed=true;
    state.battle.mode='farm';
    state.battle.encounter=24;
    state.battle.enemy=null;
    toast(`${GD.enemyName(op,25,true)} escaped. Farming Encounter 24.`);
    save(); render();
  }

  function retryTarget() {
    state.battle.mode='push'; state.battle.targetFailed=false; state.battle.encounter=25; state.battle.enemy=null; spawnEnemy(); save(); render();
  }

  function setBattleMode(mode) {
    state.battle.mode=mode;
    if(mode==='farm'){state.battle.encounter=24;state.battle.enemy=null;}
    else if(state.battle.targetFailed){retryTarget();return;}
    save();render();
  }

  function triggerFinale() {
    if(state.prestigeReady)return;
    state.prestigeReady=true; state.awaitingFinale=false; save(); enqueueStory(SD.finale);
  }

  function performPrestige() {
    const preserved={
      prestigeCount:(state.prestigeCount||0)+1,
      resolveBonus:.05*((state.prestigeCount||0)+1),
      discovered:[...state.discovered], holoSeen:[...state.holoSeen], storySeen:[...state.storySeen], settings:{...state.settings}
    };
    state=initialState();
    state.prestigeCount=preserved.prestigeCount; state.resolveBonus=preserved.resolveBonus;
    state.discovered=preserved.discovered;state.holoSeen=preserved.holoSeen;state.storySeen=preserved.storySeen;state.settings=preserved.settings;
    state.whispers=25;state.stats.whispersEarned=25;
    currentScreen='packs'; modalOpen=false; modalRoot.innerHTML=''; save(); render();
    toast(`Prestige ${state.prestigeCount}: Resolve +${Math.round(state.resolveBonus*100)}% DPS`);
  }

  function startHideoutUpgrade() {
    if(state.hideoutBuild||state.hideoutLevel>=20)return;
    const next=state.hideoutLevel+1;
    const intel=GD.hideoutIntelCost(next), req=GD.hideoutOperationReq(next);
    if(state.highestCleared<req)return toast(`Clear Operation ${req} first.`);
    if(state.intel<intel)return toast('Not enough Intel.');
    state.intel-=intel;
    const mins=GD.hideoutBuildMinutes(next)*(1-effectTotals().architect);
    state.hideoutBuild={targetLevel:next,startedAt:now(),endsAt:now()+mins*60000,baseMinutes:GD.hideoutBuildMinutes(next)};
    save();render();
  }

  function completeHideoutIfReady(force=false) {
    const b=state.hideoutBuild;if(!b)return;
    if(!force&&now()<b.endsAt)return;
    state.hideoutLevel=b.targetLevel;state.hideoutBuild=null;
    if(state.hideoutLevel>=3&&!state.unlocks.syndicate){state.unlocks.syndicate=true;enqueueStory(SD.system.syndicate);}
    if(SD.hideout[state.hideoutLevel])enqueueStory(SD.hideout[state.hideoutLevel]);
    const unlockedTier=GD.TIERS.find(t=>t.unlock===state.hideoutLevel);
    if(unlockedTier)toast(`${unlockedTier.name} Deck Booster Pack unlocked.`);
    if(state.hideoutLevel>=20&&state.awaitingFinale&&state.highestCleared>=100)triggerFinale();
    save();render();
  }

  function levelCard(id, count=1) {
    const inst=getInstance(id); if(!inst)return;
    for(let i=0;i<count;i++){
      if(inst.level>=GD.CARD_LEVEL_CAP)break;
      const cost=GD.cardLevelCost(inst.tier,inst.level);
      if(state.gold<cost)break;
      state.gold-=cost;inst.level++;
    }
    save();render();
  }

  function canSell(inst) {
    if(state.deck.includes(inst.uid)||state.syndicate.includes(inst.uid))return false;
    return state.inventory.filter(c=>c.defId===inst.defId).length>1;
  }
  function sellRefund(inst) {
    const rel=inst.tier/Math.max(1,inst.sourcePackTier||inst.tier);
    const base=(inst.sourcePackCost||GD.packBaseCost(inst.sourcePackTier||inst.tier))*0.02*(0.5+0.5*rel);
    return Math.round(base*(1+effectTotals().salvager));
  }
  function sellCard(id) {
    const inst=getInstance(id);if(!inst||!canSell(inst))return;
    const refund=sellRefund(inst);state.inventory=state.inventory.filter(c=>c.uid!==id);addWhispers(refund);save();render();toast(`Sold duplicate for ${GD.formatNum(refund)} Whispers.`);
  }

  function equipDeck(id) {
    const inst=getInstance(id),def=getDef(inst);if(!inst||!isOperationDef(def))return;
    if(state.deck.includes(id)){state.deck=state.deck.filter(x=>x!==id);} else {
      if(state.deck.length>=10)return toast('Operation Deck is full.');
      state.syndicate=state.syndicate.filter(x=>x!==id);state.deck.push(id);
    } save();render();
  }
  function equipSyndicate(id) {
    if(!state.unlocks.syndicate)return toast('Syndicate unlocks at Hideout 3.');
    const inst=getInstance(id),def=getDef(inst);if(!inst||!isSyndicateDef(def))return;
    if(state.syndicate.includes(id)){state.syndicate=state.syndicate.filter(x=>x!==id);} else {
      const slots=GD.syndicateSlots(state.hideoutLevel);if(state.syndicate.length>=slots)return toast('Syndicate is full.');
      state.deck=state.deck.filter(x=>x!==id);state.syndicate.push(id);
    } save();render();
  }

  function tick(ts) {
    const dt=Math.min(1,(ts-lastTick)/1000);lastTick=ts;
    addWhispers(whisperRate()*dt/3600);
    completeHideoutIfReady(false);

    if(modalOpen && state.battle.enemy?.target && state.battle.enemy.deadline) state.battle.enemy.deadline += dt*1000;

    if(!modalOpen&&state.firstPackOpened&&!state.battle.paused&&deckInstances().length){
      if(!state.battle.enemy)spawnEnemy();
      const enemy=state.battle.enemy;
      if(enemy){
        if(enemy.target&&enemy.deadline&&now()>=enemy.deadline&&enemy.hp>0){failTarget();}
        else{
          const ratio=enemy.hp/enemy.maxHp;
          const dps=estimateDeckDps(enemy.target,ratio);
          enemy.hp-=dps*dt;
          combatSecondBucket+=dt;
          if(combatSecondBucket>=1){combatSecondBucket-=1;procCombatSecond();}
          if(enemy.hp<=0)handleEnemyKilled();
        }
      }
      if(state.battle.momentumStacks&&now()-state.battle.lastKillAt>10000)state.battle.momentumStacks=0;
    }

    if(ts-lastRender>450){lastRender=ts;updateTopbar();if(currentScreen==='battle'&&!modalOpen)renderBattle();else if(currentScreen==='hideout'&&!modalOpen)updateHideoutTimerOnly();}
    requestAnimationFrame(tick);
  }

  function updateTopbar() {
    const set=(id,val,unlocked)=>{const el=document.getElementById(id);if(el)el.textContent=unlocked?GD.formatNum(val):'LOCK';};
    set('gold-count',state.gold,state.unlocks.gold);set('intel-count',state.intel,state.unlocks.intel);set('whisper-count',state.whispers,state.unlocks.whispers);
  }

  function render() {
    updateTopbar();
    document.body.classList.toggle('reduce-motion',!!state.settings.reducedMotion);
    document.querySelectorAll('.nav-btn').forEach(btn=>{
      const nav=btn.dataset.nav;btn.classList.toggle('active',nav===currentScreen);
      if(nav==='syndicate')btn.classList.toggle('locked',!state.unlocks.syndicate);
      if(nav==='hideout')btn.classList.toggle('locked',!state.unlocks.hideout);
    });
    switch(currentScreen){
      case 'battle':renderBattle();break;case 'hideout':renderHideout();break;case 'packs':renderPacks();break;case 'deck':renderDeck();break;case 'library':renderLibrary();break;case 'syndicate':renderSyndicate();break;case 'settings':renderSettings();break;
    }
    bindCommonActions();
  }

  function renderBattle() {
    if(!state.firstPackOpened){screen.innerHTML=`<div class="empty-state"><b>NO OPERATION DECK</b><p>Open the free Street Deck Booster Pack first.</p><button class="btn primary" data-nav="packs">GO TO PACKS</button></div>`;bindCommonActions();return;}
    if(!state.battle.enemy&&!state.battle.paused)spawnEnemy();
    const enemy=state.battle.enemy;
    const op=state.currentOperation,enc=state.battle.encounter;
    const hp=enemy?Math.max(0,enemy.hp):0,max=enemy?enemy.maxHp:1;
    const pct=100*hp/max;
    const dps=estimateDeckDps(!!enemy?.target,enemy?hp/max:1);
    const timer=enemy?.target?Math.max(0,(enemy.deadline-now())/1000):null;
    const dots=Array.from({length:25},(_,i)=>{const n=i+1;let c=n<enc?'done':'';if(n===enc)c+=' current';if(n===25)c+=' target';return `<i class="${c}"></i>`}).join('');
    const lockedFinal=state.highestCleared>=100&&state.hideoutLevel<20;
    screen.innerHTML=`
      <div class="pixel-panel">
        <div class="battle-head"><div><div class="kicker">${state.battle.mode==='farm'?'FARMING':'PUSHING'}</div><div class="operation-title">OPERATION ${op}</div></div><div class="tiny">ENCOUNTER ${enc}/25</div></div>
        <div class="encounter-dots">${dots}</div>
        ${lockedFinal?`<div class="empty-state"><b>THE FINAL DOOR IS SEALED</b><p>Operation 100 is cleared. Complete Hideout Level 20.</p></div>`:`
        <div class="enemy-card ${enemy?.target?'target':''}">
          <div><div class="enemy-meta"><span>${enemy?.target?'TARGET':'NORMAL ENEMY'}</span><span>${enemy?.target?'30s ESCAPE TIMER':'NO TIMER'}</span></div><div class="art-box">[ ENEMY ART TBD ]</div></div>
          <div><div class="enemy-name">${escapeHtml(enemy?.name||'...')}</div>
          <div class="meter ${enemy?.target?'':'blue'}"><i style="width:${pct}%"></i></div><div class="meter-label"><span>${GD.formatNum(hp)} HP</span><span>${GD.formatNum(max)} MAX</span></div>
          ${enemy?.target?`<div class="meter gold" style="margin-top:8px"><i style="width:${clamp(timer/30*100,0,100)}%"></i></div><div class="meter-label"><span>ESCAPE</span><span>${timer.toFixed(1)}s</span></div>`:''}
          </div>
        </div>`}
      </div>
      <div class="stats-grid">
        <div class="stat"><small>Deck DPS</small><b>${GD.formatNum(dps)}</b></div>
        <div class="stat"><small>Highest Clear</small><b>OP ${state.highestCleared}</b></div>
        <div class="stat"><small>Momentum</small><b>${state.battle.momentumStacks}/10</b></div>
        <div class="stat"><small>Resolve</small><b>+${Math.round((state.resolveBonus||0)*100)}%</b></div>
      </div>
      <div class="btn-row" style="margin-top:10px">
        <button class="btn ${state.battle.mode==='push'?'primary':''}" data-battle-mode="push" ${lockedFinal?'disabled':''}>${state.battle.targetFailed?'RETRY TARGET':'PUSH'}</button>
        <button class="btn ${state.battle.mode==='farm'?'primary':''}" data-battle-mode="farm" ${lockedFinal?'disabled':''}>FARM 24</button>
      </div>
      <div class="pixel-panel tight" style="margin-top:10px"><div class="tiny">NORMAL HP IN THIS OPERATION</div><b>${GD.formatNum(GD.normalEnemyHp(op))}</b><div class="tiny" style="margin-top:6px">TARGET HP IS 6× NORMAL BEFORE SABOTAGE. TARGET ESCAPES AFTER 30 SECONDS.</div></div>`;
    screen.querySelectorAll('[data-battle-mode]').forEach(b=>b.onclick=()=>setBattleMode(b.dataset.battleMode));
    bindCommonActions();
  }

  function renderHideout() {
    if(!state.unlocks.hideout){screen.innerHTML=`<div class="empty-state"><b>HIDEOUT NOT RECLAIMED</b><p>Clear Operation 1.</p></div>`;return;}
    const h=state.hideoutLevel, max=h>=20, next=h+1;
    const b=state.hideoutBuild;
    const req=max?0:GD.hideoutOperationReq(next),cost=max?0:GD.hideoutIntelCost(next),baseM=max?0:GD.hideoutBuildMinutes(next),effectiveM=baseM*(1-effectTotals().architect);
    const nextTier=!max?GD.TIERS.find(t=>t.unlock===next):null;
    screen.innerHTML=`
      <div class="hideout-room"><div class="room-label">HIDEOUT // LEVEL ${h}</div><div class="room-sub">WHISPERS ${GD.formatNum(whisperRate())}/HR // SYNDICATE ${GD.syndicateSlots(h)} SLOTS</div></div>
      <div class="pixel-panel" style="margin-top:10px">
        <div class="panel-title"><h2>${max?'HIDEOUT COMPLETE':`LEVEL ${next}`}</h2><small>${nextTier?`${nextTier.name.toUpperCase()} PACK UNLOCK`:max?'MAX LEVEL':'NETWORK EXPANSION'}</small></div>
        ${max?`<div class="empty-state"><b>ALL TWENTY LEVELS REBUILT</b><p>The network cannot expand further in this cycle.</p></div>`:b?renderBuildProgress(b):`
        <div class="requirements"><div class="req ${state.intel>=cost?'ok':'bad'}">INTEL<br><b>${GD.formatNum(cost)}</b></div><div class="req ${state.highestCleared>=req?'ok':'bad'}">CLEAR<br><b>OP ${req}</b></div></div>
        <div class="stats-grid"><div class="stat"><small>Base build time</small><b>${GD.formatTime(baseM*60)}</b></div><div class="stat"><small>Architect adjusted</small><b>${GD.formatTime(effectiveM*60)}</b></div></div>
        <button class="btn primary" id="hideout-upgrade" style="width:100%;margin-top:10px" ${state.intel<cost||state.highestCleared<req?'disabled':''}>BEGIN UPGRADE</button>`}
      </div>
      <div class="pixel-panel"><div class="panel-title"><h3>NETWORK OUTPUT</h3><small>NO PACKS ARE GENERATED AUTOMATICALLY</small></div><div class="stat"><small>Whispers generated</small><b>${GD.formatNum(whisperRate())} / HOUR</b></div><p class="tiny">The Hideout generates Whispers. You decide which unlocked Deck Booster Pack to buy.</p></div>`;
    const up=document.getElementById('hideout-upgrade');if(up)up.onclick=startHideoutUpgrade;
  }

  function renderBuildProgress(b){
    const total=b.endsAt-b.startedAt,rem=Math.max(0,b.endsAt-now()),p=100*(1-rem/total);
    return `<div class="meter green"><i style="width:${clamp(p,0,100)}%"></i></div><div class="meter-label"><span>BUILDING LEVEL ${b.targetLevel}</span><span id="build-time-left">${GD.formatTime(rem/1000)}</span></div><p class="tiny">Construction continues while you are away.</p>`;
  }
  function updateHideoutTimerOnly(){
    if(!state.hideoutBuild)return;const el=document.getElementById('build-time-left');if(el)el.textContent=GD.formatTime((state.hideoutBuild.endsAt-now())/1000);
  }

  function renderPacks() {
    const highest=GD.tierForHideout(state.hideoutLevel);const e=effectTotals();
    const cards=GD.TIERS.map(t=>{
      const locked=state.hideoutLevel<t.unlock;const price=packCost(t.id);const odds=GD.packOdds(t.id,state.hideoutLevel,e.appraiser);
      const oddsText=odds.slice().sort((a,b)=>b.tier-a.tier).map(o=>`${GD.tierData(o.tier).name} ${(o.p*100).toFixed(o.p<.01?2:1)}%`).join(' · ');
      const free=state.freeStreetPack&&t.id===1;
      return `<div class="pack-shop-card ${locked?'locked':''}" style="color:${t.accent}">
        <div class="pack-mini"><div><b>${t.name.toUpperCase()} DECK</b><small>BOOSTER PACK</small></div></div>
        <div><div class="odds-mini">${locked?`UNLOCKS AT HIDEOUT ${t.unlock}`:`9 RANDOM: ${oddsText}<br>+ 1 GUARANTEED ${t.name.toUpperCase()}`}</div>
        <div class="pack-cost">${free?'FREE FIRST PACK':`${GD.formatNum(price)} WHISPERS`}</div>
        <button class="btn ${t.id===highest?'primary':''}" data-open-pack="${t.id}" ${locked?'disabled':''} style="width:100%;margin-top:7px">${free?'OPEN FREE PACK':'BUY + OPEN'}</button></div>
      </div>`;
    }).join('');
    screen.innerHTML=`<div class="pixel-panel tight"><div class="panel-title"><h2>DECK BOOSTER PACKS</h2><small>10 CARDS EACH</small></div><p class="tiny">Every pack guarantees one card from its named tier. The other nine use the shown odds. Hideout levels improve odds even between new pack unlocks.</p></div><div class="pack-grid">${cards}</div>`;
    screen.querySelectorAll('[data-open-pack]').forEach(b=>b.onclick=()=>openPack(Number(b.dataset.openPack),state.freeStreetPack&&Number(b.dataset.openPack)===1));
  }

  function renderDeck() {
    const deck=deckInstances();const slots=Array.from({length:10},(_,i)=>{
      const inst=deck[i];if(!inst)return `<div class="deck-slot"><span class="slot-tag">SLOT ${i+1}</span><small>EMPTY</small></div>`;
      const def=getDef(inst),td=GD.tierData(inst.tier);return `<div class="deck-slot filled" style="border-color:${td.accent}"><span class="slot-tag">${td.name}</span><b>${escapeHtml(def.name)}</b><small>LV ${inst.level} · ${GD.formatNum(GD.cardDps(inst))} DPS</small></div>`;
    }).join('');
    const candidates=state.inventory.filter(c=>isOperationDef(getDef(c))).sort((a,b)=>GD.cardDps(b)-GD.cardDps(a));
    screen.innerHTML=`<div class="pixel-panel"><div class="panel-title"><h2>OPERATION DECK</h2><small>${deck.length}/10 ACTIVE</small></div><div class="deck-slots">${slots}</div><button class="btn primary" id="auto-deck" style="width:100%;margin-top:10px">AUTO EQUIP HIGHEST DPS</button></div><div class="pixel-panel"><div class="panel-title"><h3>OPERATIVES</h3><small>GOLD LEVELS CARDS</small></div><div class="inventory-list">${candidates.length?candidates.map(renderInventoryRow).join(''):'<div class="empty-state">NO OPERATION CARDS</div>'}</div></div>`;
    document.getElementById('auto-deck').onclick=()=>{autoFillDeck();save();render();};bindInventoryButtons();
  }

  function renderInventoryRow(inst) {
    const def=getDef(inst),td=GD.tierData(inst.tier),equipped=state.deck.includes(inst.uid)||state.syndicate.includes(inst.uid),cost=inst.level<GD.CARD_LEVEL_CAP?GD.cardLevelCost(inst.tier,inst.level):0;

      ${zone==='deck'?`<button class="mini-btn" data-equip-deck="${inst.uid}">${state.deck.includes(inst.uid)?'REMOVE':'EQUIP'}</button>`:`<button class="mini-btn" data-equip-syn="${inst.uid}">${state.syndicate.includes(inst.uid)?'REMOVE':'ASSIGN'}</button>`}
      ${zone==='deck'?`<button class="mini-btn" data-level="${inst.uid}" ${state.gold<cost||inst.level>=GD.CARD_LEVEL_CAP?'disabled':''}>LV+ ${inst.level>=GD.CARD_LEVEL_CAP?'MAX':GD.formatNum(cost)}</button>`:''}
      <button class="mini-btn" data-detail="${inst.uid}">VIEW</button>

    screen.querySelectorAll('[data-equip-syn]').forEach(b=>b.onclick=()=>equipSyndicate(b.dataset.equipSyn));

  }

    <div class="stats-grid"><div class="stat"><small>Architect</small><b>-${Math.round(e.architect*100)}%</b></div><div class="stat"><small>Broker</small><b>-${Math.round(e.broker*100)}%</b></div><div class="stat"><small>Appraiser</small><b>+${Math.round(e.appraiser*100)}% rel.</b></div><div class="stat"><small>Salvager</small><b>+${Math.round(e.salvager*100)}%</b></div></div>
    <div class="pixel-panel" style="margin-top:10px"><div class="panel-title"><h3>AVAILABLE</h3><small>PASSIVES ONLY WORK HERE</small></div><div class="inventory-list">${candidates.length?candidates.map(renderInventoryRow).join(''):'<div class="empty-state">NO SYNDICATE CARDS DISCOVERED</div>'}</div></div>`;

    const filters=[`<button class="filter-btn ${libraryFilter===0?'on':''}" data-lib-filter="0">ALL</button>`].concat(GD.TIERS.map(t=>`<button class="filter-btn ${libraryFilter===t.id?'on':''}" data-lib-filter="${t.id}">${t.name}</button>`)).join('');

    screen.querySelectorAll('[data-lib-card]').forEach(b=>b.onclick=()=>showDefinitionDetail(b.dataset.libCard));
  }

  function showCardDetail(id){const inst=getInstance(id);if(!inst)return;showDefinitionDetail(inst.defId,inst.uid);}
  function showDefinitionDetail(defId,instId=null){
    const def=GD.CARD_MAP[defId],td=GD.tierData(def.tier);const copies=state.inventory.filter(c=>c.defId===defId);const inst=instId?getInstance(instId):copies.sort((a,b)=>GD.cardDps(b)-GD.cardDps(a))[0];
    modalOpen=true;modalRoot.innerHTML=`<div class="modal-backdrop"><div class="modal card-detail"><div class="kicker" style="color:${td.accent}">${td.name.toUpperCase()} CARD</div><h2>${escapeHtml(def.name)}</h2><div class="detail-art">[ CARD ART TBD ]</div><div class="detail-stats"><div class="detail-stat"><small>COPIES OWNED</small><b>${copies.length}</b></div><div class="detail-stat"><small>HOLO SEEN</small><b>${state.holoSeen.includes(defId)?'YES':'NO'}</b></div>${inst?`<div class="detail-stat"><small>LEVEL</small><b>${inst.level}</b></div><div class="detail-stat"><small>CURRENT DPS</small><b>${GD.formatNum(GD.cardDps(inst))}</b></div>`:''}</div><div class="pixel-panel tight"><b>${def.ability?escapeHtml(def.ability.name):'NO SPECIAL ABILITY'}</b><p class="tiny">${def.ability?escapeHtml(def.ability.text):'Street-tier cards rely on their rolled base damage and Gold levels.'}</p></div><button class="btn primary" id="detail-close" style="width:100%">CLOSE</button></div></div>`;
    document.getElementById('detail-close').onclick=()=>{modalRoot.innerHTML='';modalOpen=false;};
  }

  function renderSettings() {
    const stories=state.storySeen.map(id=>findStoryById(id)).filter(Boolean);
    screen.innerHTML=`<div class="pixel-panel"><div class="panel-title"><h2>MORE</h2><small>SAVE + PROTOTYPE</small></div><div class="settings-list">
      <div class="setting"><div><b>AUTOSAVE</b><div class="tiny">${storageMode==='local'?'Progress saves locally every few seconds.':'This local-file viewer blocks persistent browser storage. Progress is safe only while this file stays open; host the PWA over HTTPS for persistent saves.'}</div></div><span class="${storageMode==='local'?'good':'warn'}">${storageMode==='local'?'ON':'SESSION'}</span></div>
      <div class="setting"><div><b>REDUCED MOTION</b><div class="tiny">Shortens pack and card transitions.</div></div><button class="mini-btn" id="toggle-motion">${state.settings.reducedMotion?'ON':'OFF'}</button></div>
      <div class="setting"><div><b>PRESTIGE</b><div class="tiny">Cycle ${state.prestigeCount} · Resolve +${Math.round((state.resolveBonus||0)*100)}%</div></div><span>—</span></div>
    </div></div>
    <div class="pixel-panel"><div class="panel-title"><h3>STORY LOG</h3><small>SEEN ONLY</small></div><div class="story-log">${stories.length?stories.map(s=>`<button class="story-entry" data-story-replay="${s.id}"><b>${escapeHtml(s.title)}</b><small>REPLAY</small></button>`).join(''):'<div class="empty-state">NO STORY ENTRIES YET</div>'}</div></div>
    <div class="pixel-panel"><div class="panel-title"><h3>PROTOTYPE TOOLS</h3><small>TESTING ONLY</small></div><div class="dev-grid"><button class="btn ghost" data-dev="gold">+1M GOLD</button><button class="btn ghost" data-dev="intel">+1M INTEL</button><button class="btn ghost" data-dev="whispers">+1M WHISPERS</button><button class="btn ghost" data-dev="build">FINISH BUILD</button><button class="btn ghost" data-dev="kill">KILL ENEMY</button><button class="btn ghost" data-dev="clear">CLEAR OP</button><button class="btn danger" data-dev="reset">RESET SAVE</button><button class="btn ghost" data-dev="export">EXPORT SAVE</button></div></div>`;
    document.getElementById('toggle-motion').onclick=()=>{state.settings.reducedMotion=!state.settings.reducedMotion;save();render();};
    screen.querySelectorAll('[data-story-replay]').forEach(b=>b.onclick=()=>{const s=findStoryById(b.dataset.storyReplay);if(s)enqueueStory(s,true);});
    screen.querySelectorAll('[data-dev]').forEach(b=>b.onclick=()=>devAction(b.dataset.dev));
  }

  function findStoryById(id){
    const all=[SD.opening,SD.firstPack,SD.finale,SD.prestige,...Object.values(SD.hideout),...Object.values(SD.operations),...Object.values(SD.system)];return all.find(s=>s.id===id);
  }

  function devAction(action){
    if(action==='gold'){state.gold+=1e6;state.unlocks.gold=true;}
    if(action==='intel'){state.intel+=1e6;state.unlocks.intel=true;state.unlocks.hideout=true;}
    if(action==='whispers'){state.whispers+=1e6;}
    if(action==='build'&&state.hideoutBuild){completeHideoutIfReady(true);return;}
    if(action==='kill'&&state.battle.enemy){state.battle.enemy.hp=0;handleEnemyKilled();}
    if(action==='clear'){
      if(!state.firstPackOpened)return toast('Open first pack first.');
      state.opEntryFlags[state.currentOperation]=true;state.battle.encounter=25;state.battle.enemy=null;spawnEnemy();state.battle.enemy.hp=0;handleEnemyKilled();
    }
    if(action==='reset'){if(confirm('Delete the entire prototype save?')){storageRemove(SAVE_KEY);location.reload();}return;}
    if(action==='export'){
      const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='night-ledger-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);return;
    }
    save();render();
  }

  function bindCommonActions(){
    document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>navigate(b.dataset.nav));
  }
  function navigate(nav){
    if(nav==='hideout'&&!state.unlocks.hideout)return toast('Clear Operation 1 to reclaim the Hideout.');
    if(nav==='syndicate'&&!state.unlocks.syndicate)return toast('Syndicate unlocks at Hideout 3.');
    currentScreen=nav;render();
  }

  function escapeHtml(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}

  function onFirstKillStory(){/* reserved for future pacing hooks */}

  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){save();lastVisibilityAt=now();}
    else{
      const elapsed=(now()-lastVisibilityAt)/1000;
      if(state.battle.enemy?.target && state.battle.enemy.deadline) state.battle.enemy.deadline += elapsed*1000;
      if(elapsed>30){state.lastSavedAt=lastVisibilityAt;applyOfflineProgress();save();render();}
    }
  });
  window.addEventListener('beforeunload',save);
  setInterval(save,3000);

  window.__NL = { getState:()=>state, openPack, navigate, devAction, retryTarget, startHideoutUpgrade, completeHideoutIfReady, levelCard, equipDeck, equipSyndicate, autoFillDeck, autoFillSyndicate, packCost, effectTotals, save };

  load();render();bindCommonActions();requestAnimationFrame(tick);
  if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('service-worker.js').catch(()=>{});
})();

  </script>
</body>
</html>
